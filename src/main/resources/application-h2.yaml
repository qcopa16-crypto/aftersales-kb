spring:
  datasource:
    url: jdbc:h2:mem:aftersales_kb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  h2:
    console:
      # 默认关闭；本地需要排查时显式设置 H2_CONSOLE_ENABLED=true 再启动
      enabled: ${H2_CONSOLE_ENABLED:false}

jwt:
  # 不内置默认密钥：本地开发请在环境变量 / .env 中设置 JWT_SECRET（>= 32 字节随机串，
  # 可用 `openssl rand -base64 48` 生成）。自动化测试的专用值见
  # src/test/resources/application.properties（该目录不入库）。
  secret: ${JWT_SECRET:}

ai:
  # 不内置默认值：须与 AI 侧 INTERNAL_TOKEN 一致，通过环境变量 / .env 提供。
  internal-token: ${AI_INTERNAL_TOKEN:}
