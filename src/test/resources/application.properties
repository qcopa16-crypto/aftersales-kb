# 测试专用覆盖配置（与主 application.yaml 合并，键不冲突）
# 安全审计 S4：主配置已 fail-closed（默认 profile 不再回退 h2），
# 自动化测试必须显式激活 h2 profile，否则 StartupSecurityValidator 会拒绝内置默认密钥。
spring.profiles.active=h2
# 关闭后台入库 Worker，避免测试期间产生后台 AI 调用；需要时由用例显式开启并手动驱动。
app.ingest.worker.enabled=false
# 测试内重试退避置 0：可重试失败立即重排，保证 drainWorker 的同步轮询仍能在少量 poll 内完成重试。
app.ingest.worker.retry-backoff-ms=0
app.storage.local-path=./target/test-uploads
logging.level.com.shuidun.kb=info
